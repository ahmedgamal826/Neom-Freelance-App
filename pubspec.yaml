name: neon
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter

  ## t2 -- Presentation (UI/UX and Animations)
  loading_animation_widget: ^1.2.0+4
  font_awesome_flutter: ^10.4.0
  flutter_gemini: ^2.0.5
  dash_chat_2: ^0.0.21

  ## t2 -- Providers (State Management and Firestore Integration)
  cloud_firestore: ^5.4.3
  firebase_core: ^3.6.0

  ## t2 -- Services (Localization, Notifications, and Utilities)
  flutter_dotenv: ^5.0.2
  logger: ^2.4.0
  min_id: ^1.1.0
  flutter_easyloading: ^3.0.5

  ## t2 -- Firebase and Authentication
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1
  firebase_crashlytics: ^4.1.3

  ## t2 -- Date, Location, and Camera
  ## t2 -- Miscellaneous
  stack_trace: ^1.11.0
  http: ^1.2.2
  shared_preferences: 2.2.2
  audioplayers: ^6.6.0
  auto_size_text: ^3.0.0
  flutter_local_notifications: ^17.2.4
  flutter_timezone: ^3.0.1
  intl: ^0.19.0
  permission_handler: ^11.3.1
  provider: ^6.1.2
  shimmer: ^3.0.0
  timezone: ^0.9.4
  # uuid: ^4.5.1
  uuid: ^3.0.7

dependency_overrides:
  shared_preferences_android: 2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_application_id: ^2.0.0
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/sound.mp3
    - assets/images/
    - prod.env
    - dev.env